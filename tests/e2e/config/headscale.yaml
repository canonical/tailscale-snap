---
server_url: "https://headscale.e2e.test"
listen_addr: "0.0.0.0:443"
metrics_listen_addr: "127.0.0.1:9090"
grpc_listen_addr: "127.0.0.1:50443"
grpc_allow_insecure: false
noise:
  private_key_path: "/var/snap/headscale/common/internal/noise_private.key"
prefixes:
  v6: "fd7a:115c:a1e0::/48"
  v4: "100.64.0.0/10"
  allocation: sequential
derp:
  server:
    enabled: false
  urls: []
  paths:
    - "/var/snap/headscale/common/derp.yaml"
  auto_update_enabled: true
  update_frequency: 24h
disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m
database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: "/var/snap/headscale/common/internal/db.sqlite"
    write_ahead_log: true
tls_cert_path: "/var/snap/headscale/common/headscale.crt"
tls_key_path: "/var/snap/headscale/common/headscale.key"
log:
  format: text
  level: info
policy:
  mode: file
  path: "/var/snap/headscale/common/policies.hujson"
dns:
  magic_dns: true
  base_domain: tailnet.internal
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    split: {}
  search_domains: []
  extra_records: []
unix_socket: "/var/snap/headscale/common/internal/headscale.sock"
unix_socket_permission: "0770"
